ll-width colour slabs (one tap target each);</text><text x="34.0" y="606.0" font-size="10.5" fill="#1b1d20" font-weight="400" text-anchor="start" font-family="Helvetica, Arial, sans-serif" >the status elevation and monoliths reflow to 2-up; phone number is split over two lines at display size and remains one tappable link.</text></svg>